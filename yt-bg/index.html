<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>yt-bg</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
#log { position: absolute; top: 0; left: 0; z-index: 9; margin: 4px; color: #fff; font: 12px monospace; display: none; }
</style>
</head>
<body>
<div id="player"></div>
<pre id="log"></pre>
<script>
const params = new URLSearchParams(location.search);
const v = params.get("v") || "";
const log = (msg) => {
  if (!params.has("debug")) return;
  const el = document.getElementById("log");
  el.style.display = "block";
  el.textContent += `${new Date().toTimeString().slice(0, 8)} ${msg}\n`;
};
log("visibility=" + document.visibilityState);
document.addEventListener("visibilitychange", () => log("visibility=" + document.visibilityState));
function onYouTubeIframeAPIReady() {
  log("api ready");
  new YT.Player("player", {
    videoId: v,
    host: "https://www.youtube-nocookie.com",
    playerVars: { autoplay: 1, mute: 1, loop: 1, playlist: v, controls: 0, disablekb: 1,
                  playsinline: 1, rel: 0, iv_load_policy: 3, fs: 0 },
    events: {
      onReady: (e) => { log("player ready"); e.target.mute(); e.target.playVideo(); },
      onStateChange: (e) => log("state=" + e.data),
      onError: (e) => log("error=" + e.data),
    },
  });
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
